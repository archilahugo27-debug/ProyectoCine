<h2>Crear genero nuevo:</h2>
<div class="container text">
    <form [formGroup]="formulario" (ngSubmit)="guardar()">
        <div class="mb-3 row">
            <label class="col-sm-2 col-form-label">Nombre:</label>
            <div class="col-sm-10">
            <input type="text" formControlName="nombre" class="form-control">
            @if(formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched){
            <div>El nombre es obligatorio</div>
            }
            </div>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
    </form>
    <h2>Consulta de usuarios:</h2>

    <table class="table table-hover table-striped-columns table-bordered">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
            </tr>
        </thead>
        <tbody>
            @for(genero of generos; track generos.idGenero){
            <tr>
                <td>{{genero.idGenero}}</td>
                <td>{{genero.nombre}}</td>
            </tr>
            }
        </tbody>
    </table>
</div>
