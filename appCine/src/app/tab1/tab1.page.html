<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Anuncios
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Anuncios</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for(anuncio of anuncios; track anuncio.idAnuncio){
    <ion-item>
      <ion-label>
        <ion-card>
          @if(anuncio.imagen) {
          <img [src]="'data:image/jpeg;base64,' + anuncio.imagen" width="100%" alt="Anuncio">
          } @else {
          <img alt="Logo" src="assets\logo.png" />
          }
          <ion-card-header>
            <ion-card-title>{{anuncio.titulo}}</ion-card-title>
            <ion-card-subtitle>{{anuncio.fechaPublicacion | date}}</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content>
            {{anuncio.descripcion}}
          </ion-card-content>
        </ion-card>
      </ion-label>
    </ion-item>
    }
  </ion-list>
</ion-content>
